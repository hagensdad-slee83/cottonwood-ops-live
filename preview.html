<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cottonwood Ops</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8ecf4;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px}h1{font-size:clamp(2rem,5vw,4rem);margin:0 0 8px;color:#c9a227}p{color:#8b95ad}.card{background:#161d34;border:1px solid #303956;border-radius:16px;padding:20px;margin:16px 0}.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.tile{padding:18px;border:1px solid #3ecfbf;border-radius:12px;background:#12182b}.name{font-size:1.25rem;font-weight:700}.role{color:#3ecfbf}.mascot{font-size:4rem;text-align:center;padding:20px;border-radius:16px;background:linear-gradient(90deg,#10182c,#152038,#10182c)}button{padding:10px 14px;border:0;border-radius:8px;background:#c9a227;color:#1a1406;font-weight:700}</style></head><body><main><h1>Cottonwood Ops</h1><p>Operations Dashboard · self-contained locked-brief preview</p><section class="mascot" aria-label="Buck and pelican apple heist">🦌 🍎 🦤 <span>pelican in pursuit</span></section><section class="card"><h2>STL shift tiles</h2><div class="roster"><article class="tile"><div>D Shift · Days</div><div class="name">William McGallion</div><div class="role">STL</div></article><article class="tile"><div>B Shift · Nights</div><div class="name">John Pettier</div><div class="role">STL</div></article></div></section><section class="card"><h2>Quick update</h2><textarea id="note" rows="4" style="width:100%;background:#0b1020;color:#e8ecf4" placeholder="Shift note"></textarea><button onclick="save()">Save tracking data</button><p id="status"></p></section></main><script>function save(){const n=document.querySelector('#note').value.trim();localStorage.setItem('cottonwood-quick-v1',n);document.querySelector('#status').textContent=n?'Saved. Still here after refresh.':'Enter a note first.'}</script></body></html>
